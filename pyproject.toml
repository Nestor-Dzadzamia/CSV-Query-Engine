[project]
name = "csv-query-engine"
version = "0.1.0"
description = "A reusable Python library for querying CSV data with a simple, composable API."
readme = "README.md"
authors = [
    { name = "Nestor-Dzadzamia", email = "ndzad22@freeuni.edu.ge" }
]
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.0.5",
    "uv-build>=0.12.1,<0.13.0",
]


[tool.uv.build-backend]
module-name = "csvquery"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pandas-stubs>=3.0.5.260914",
    "pytest>=9.1.1",
]
